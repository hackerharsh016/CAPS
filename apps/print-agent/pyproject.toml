[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "caps-agent"
version = "0.1.0"
description = "CAPS (Cloud Automated Printing Solution) — Desktop Print Agent for Windows"
readme = "README.md"
authors = [{ name = "CAPS Engineering Team" }]
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "jsonschema>=4.20.0",
]


[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
]
windows = [
    "pywin32>=306; sys_platform == 'win32'",
]
packaging = [
    "pyinstaller>=6.4.0",
    "pefile>=2024.8.26",
]
rendering = [
    "pypdfium2>=4.30.0",
    "pillow>=10.0.0",
]

[project.scripts]
caps-agent = "caps_agent.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line too long (handled by formatter)
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["src"]
