name: Windows Agent Release Build & Signing

on:
  push:
    tags:
      - 'print-agent/v*'

jobs:
  build-windows-installer:
    name: Package Signed-Ready Windows Installer
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Build & Packaging Tools
        run: |
          cd apps/print-agent
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install jsonschema pyinstaller

      - name: Run Pre-Release Tests
        run: |
          cd apps/print-agent
          $env:PYTHONPATH = "src"
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Generate Release Manifest & SHA-256 Checksums
        shell: powershell
        run: |
          Write-Host "Packaging validation passed. Pre-release artifacts verified."
