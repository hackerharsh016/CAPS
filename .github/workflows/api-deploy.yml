name: Cloud API Deployment

on:
  push:
    tags:
      - 'cloud-api/v*'

jobs:
  deploy-api:
    name: Deploy Cloud API Server
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.2

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Backend Tests
        run: pnpm --filter @caps/cloud-api test

      - name: Build API Distribution
        run: pnpm --filter @caps/cloud-api build

      - name: Deployment Smoke Check
        run: echo "Cloud API release build ready for container deployment."
